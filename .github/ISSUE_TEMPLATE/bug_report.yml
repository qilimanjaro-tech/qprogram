name: Bug Report
description: Report a bug or unexpected behavior in QProgram
title: "[Bug]: "
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Keep it short. A one-line title like `<operation> ignores its <argument>` plus a snippet that fails is enough.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What is broken, in a sentence or two. Add the cause or a suggested fix if you know it.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: minimal_example
    attributes:
      label: Minimal Reproducible Example
      description: The shortest program that shows the problem.
      placeholder: |
        import qprogram as qp

        # Your minimal example here
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Paste the output, error message or traceback. No need to describe it in words.
      render: shell
    validations:
      required: true

  - type: textarea
    id: qp_file
    attributes:
      label: ".qp Text"
      description: |
        For a serialization, parsing or validation bug, paste the `.qp` text — `print(qp.dumps(program))`, or the file itself if it came from disk.
      render: text
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: System Information
      description: |
        Output of:

        ```python
        import platform, sys, qprogram as qp
        from importlib.metadata import entry_points

        print("qprogram", qp.__version__)
        print("python  ", sys.version.split()[0], "|", platform.platform())
        print("vendors ", sorted(e.name for e in entry_points(group="qprogram.vendors")) or "none")
        ```

        If you are a maintainer on a dev checkout, the version and OS is enough.
      render: shell
    validations:
      required: true
