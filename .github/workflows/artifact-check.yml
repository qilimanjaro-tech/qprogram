name: Artifact compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: artifact-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  round-trip:
    name: Distribution artifact round trip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false
          python-version: "3.13"
      - name: Build distributions
        run: uv build
      - name: Record distribution checksums
        run: sha256sum dist/* > "$RUNNER_TEMP/dist.sha256"
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 1
      - name: Move original distributions aside
        run: mv dist uploaded-dist
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist
      - name: Verify distribution checksums and inventory
        run: |
          sha256sum --strict --check "$RUNNER_TEMP/dist.sha256"
          # uv creates .gitignore, which is outside the dist/* artifact input.
          diff --recursive --exclude=.gitignore uploaded-dist dist
