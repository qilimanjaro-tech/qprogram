name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - "opened"
      - "reopened"
      - "synchronize"
      - "ready_for_review"

concurrency:
  group: code-quality-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
          python-version: "3.13"

      # Ruff takes its whole configuration from pyproject.toml and never imports
      # the code, so linting needs the linters and nothing else. --no-build keeps
      # every dependency to its pre-built wheel, so no third-party build backend runs.
      - name: Install the linters
        run: |
          uv sync --frozen --only-group dev --no-install-project --no-build
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Format
        run: ruff format --diff .

  types:
    name: Types
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
          python-version: "3.13"

      # --no-build keeps every dependency to its pre-built wheel, so no third-party
      # build backend runs here. The project itself has no wheel to install from, so
      # it is built in a second step that resolves nothing.
      - name: Install the project
        run: |
          uv sync --frozen --group dev --all-extras --no-build --no-install-project
          uv pip install --no-deps -e .
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # ty resolves the standard library for the version it is told to assume,
      # so one environment covers every version the package supports.
      - name: Type checking
        run: |
          for version in 3.11 3.12 3.13 3.14; do
            echo "::group::ty check --python-version $version"
            ty check --output-format=github --python-version "$version"
            echo "::endgroup::"
          done

  code-quality:
    name: Code Quality
    needs: [lint, types]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Check the results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
