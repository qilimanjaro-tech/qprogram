name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform to publish the built distributions to"
        type: choice
        default: pypi
        options:
          - pypi
          - aws
      repository:
        description: "AWS CodeArtifact repository to publish to (only used when platform is aws)"
        type: string
        default: qilimanjaro
      dry_run:
        description: "Build and validate the distributions, but do not upload them"
        type: boolean
        default: false

# Never run two publishes for the same target at once, and never cancel one
# mid-upload (a partial upload to an index can be impossible to recover from).
concurrency:
  group: publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  # Fails in seconds on a bad dispatch, instead of after the distributions build.
  check-inputs:
    name: Check inputs
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the repository input
        if: ${{ (inputs.platform || 'pypi') == 'aws' && !inputs.repository }}
        run: |
          echo "::error::Publishing to aws needs a CodeArtifact repository. Re-run with the repository input set."
          exit 1

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [check-inputs]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
          python-version: "3.13"
      # qprogram is pure Python, so one wheel serves every interpreter and every
      # platform and there is nothing for cibuildwheel to do. `uv build` writes
      # that wheel and the sdist together.
      - name: Build distributions
        run: uv build
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/*

  deploy-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ (inputs.platform || 'pypi') == 'pypi' }}
    environment:
      name: pypi
      url: https://pypi.org/p/qprogram
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false
          python-version: "3.13"
      # twine is pinned so that a release of it cannot change what this step
      # accepts, and --no-build stops uv building a source distribution, which
      # would run a dependency's setup code inside the job holding the upload
      # credential.
      - name: List & validate distributions
        run: |
          ls -lh dist
          uvx --no-build twine@7.0.0 check dist/*
      - name: Publish to PyPI
        run: >-
          uv publish
          --trusted-publishing always
          --check-url https://pypi.org/simple/qprogram/
          ${{ inputs.dry_run && '--dry-run' || '' }}

  deploy-codeartifact:
    name: Publish to AWS CodeArtifact (${{ inputs.repository }})
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ (inputs.platform || 'pypi') == 'aws' }}
    env:
      AWS_REGION: eu-west-1
      CA_DOMAIN: qilimanjaro
      CA_DOMAIN_OWNER: "723412851021"
      CA_REPOSITORY: ${{ inputs.repository }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: arn:aws:iam::723412851021:role/GitHub_actions_role
          aws-region: eu-west-1
          role-session-name: GitHubActions-DevOps
      - name: Assume deploy role in target account
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: arn:aws:iam::723412851021:role/Code-Artifact-Publish
          aws-region: eu-west-1
          role-session-name: GitHubActions-Deploy
          role-chaining: true
          role-skip-session-tagging: true
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false
          python-version: "3.13"
      - name: List & validate distributions
        run: |
          ls -lh dist
          uvx --no-build twine@7.0.0 check dist/*
      - name: Publish to CodeArtifact
        if: ${{ !inputs.dry_run }}
        run: |
          export TWINE_USERNAME=aws
          export TWINE_PASSWORD=$(aws codeartifact get-authorization-token \
            --domain "$CA_DOMAIN" \
            --domain-owner "$CA_DOMAIN_OWNER" \
            --query authorizationToken \
            --output text)
          export TWINE_REPOSITORY_URL=$(aws codeartifact get-repository-endpoint \
            --domain "$CA_DOMAIN" \
            --domain-owner "$CA_DOMAIN_OWNER" \
            --repository "$CA_REPOSITORY" \
            --format pypi \
            --query repositoryEndpoint \
            --output text)
          uvx --no-build twine@7.0.0 upload dist/*
