[project]
name = "my-platform"
version = "0.1.0"
description = "An imaginary QProgram platform wiring qblox drive/readout and qdac flux per-bus"
authors = [{name = "Qilimanjaro Quantum Tech", email = "info@qilimanjaro.tech"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qprogram>=0.1.0",
    "qprogram-qblox>=0.1.0",
    "qprogram-qdac>=0.1.0",
]

# NOTE: unlike the qblox/qdac vendor packages, this package is a *platform*, not a
# vendor. It adds no `program.<name>` namespace and no .qp `require <name>` token, so
# it deliberately declares NO `[project.entry-points."qprogram.vendors"]` table. It
# only consumes the capability machinery the core and vendor packages expose.

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "jupyterlab>=4.0.0",
    "matplotlib>=3.8.0",
    "nbconvert>=7.16.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.uv.sources]
qprogram = { path = "../qprogram", editable = true }
qprogram-qblox = { path = "../qprogram-qblox", editable = true }
qprogram-qdac = { path = "../qprogram-qdac", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_platform"]

[tool.ruff]
line-length = 120
target-version = "py311"
