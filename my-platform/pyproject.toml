[project]
name = "my-platform"
version = "0.1.0"
description = "An imaginary QProgram platform (qblox drive/readout, qdac flux) and vendor extension (RF switch + crosstalk)"
authors = [{name = "Qilimanjaro Quantum Tech", email = "info@qilimanjaro.tech"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qprogram>=0.1.0",
    "qprogram-qblox>=0.1.0",
    "qprogram-qdac>=0.1.0",
]

# NOTE: this package wears two hats. It is a *platform* (MyPlatform declares per-bus
# capabilities and validates/explains/executes against them) AND a *vendor* extension:
# it ships the `myplatform` namespace (`program.myplatform.*`), a couple of vendor
# operations, a new RF-switch bus schema, and its own capability profiles. Because it is
# now also a vendor, it declares the `qprogram.vendors` entry point below so a `.qp` file
# carrying `require myplatform <x.y>` auto-activates this package on load (run `uv sync`
# after editing this table so the entry point lands in the installed metadata).

[project.entry-points."qprogram.vendors"]
myplatform = "my_platform"

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "jupyterlab>=4.0.0",
    "matplotlib>=3.8.0",
    "nbconvert>=7.16.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.uv.sources]
qprogram = { path = "../qprogram", editable = true }
qprogram-qblox = { path = "../qprogram-qblox", editable = true }
qprogram-qdac = { path = "../qprogram-qdac", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_platform"]

[tool.ruff]
line-length = 120
target-version = "py311"
