[project]
name = "qprogram-qblox"
version = "0.1.0"
description = "Qblox vendor extensions for QProgram DSL"
authors = [{name = "Qilimanjaro Quantum Tech", email = "info@qilimanjaro.tech"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qprogram>=0.1.0",
]

[tool.uv.sources]
qprogram = { path = "../qprogram", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py313"
