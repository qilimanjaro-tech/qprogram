[project]
name = "qprogram-qdac"
version = "0.1.0"
description = "QDevil QDAC vendor extensions for QProgram DSL"
authors = [{name = "Qilimanjaro Quantum Tech", email = "info@qilimanjaro.tech"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "qprogram>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.12",
]

[tool.uv.sources]
qprogram = { path = "../qprogram", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN",
    "D",
    "S101",
    "PLR0915",
    "SLF001",
    "INP001",
    "PT011",
    "B011",
    "PTH118",
    "FIX002",
    "BLE001",
    "ERA001",
    "T201",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
source = ["qprogram_qdac"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "pragma: no cover",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
show_missing = true
skip_covered = false
precision = 1
