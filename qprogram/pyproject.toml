[project]
name = "qprogram"
version = "0.1.0"
description = "QProgram - A Domain-Specific Language for Pulse-Level Quantum Programming"
authors = [{name = "Qilimanjaro Quantum Tech", email = "info@qilimanjaro.tech"}]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["quantum", "pulse programming", "dsl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=1.26.0",
    "xarray>=2026.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.13",
    "ty>=0.0.38",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "pytest-mock>=3.15.1",
]
docs = [
    "zensical>=0.0.43",
    "mkdocstrings[python]>=0.26", 
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py314"
builtins = ["_"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN003", "C901", "COM812", "D1", "FBT001", "FBT002", "E501", "E741", "N802", "N803", "PLR0911", "PLR0912", "PLR2004"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
suppress-dummy-args = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN",
    "D",
    "S101",
    "PLR0915",
    "SLF001",
    "INP001",
    "PT011",
    "B011",
    "PTH118",
    "FIX002",
    "BLE001",
    "ERA001",
    "T201",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
source = ["qprogram"]
branch = true
omit = ["src/qprogram/platform.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "pragma: no cover",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
show_missing = true
skip_covered = false
precision = 1
